{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обновление аватара</title>
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 500px;">
        <div class="card p-4 shadow-sm">
            <h2>Обновить аватар</h2>
            <form method="post" enctype="multipart/form-data" class="mb-3">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Сохранить аватар</button>
            </form>
            
            {% if request.user.student.avatar %}
                <p>Текущий аватар:</p>
                <img src="{{ request.user.student.avatar.url }}" alt="avatar" style="max-width: 150px;" class="img-thumbnail">
            {% endif %}
        </div>
    </div>
</body>
</html>
