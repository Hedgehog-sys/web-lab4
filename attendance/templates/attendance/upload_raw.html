<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Диагностика загрузки</title>
</head>
<body>
    <h2>Ручная загрузка файла частями (Задание 1)</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="file_upload" required>
        <button type="submit">Отправить файл</button>
    </form>
</body>
</html>
